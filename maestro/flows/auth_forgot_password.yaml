appId: com.anonymous.eiyusystem
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "EIYU SYSTEM"
    timeout: 30000
- tapOn: "Forgot password?"
- assertVisible: "Reset access"
- tapOn: "SEND RECOVERY LINK"
- assertVisible: "Enter your email."
- tapOn: "you@example.com"
- inputText: "maestro.tester@example.com"
- hideKeyboard
- tapOn: "SEND RECOVERY LINK"
- assertVisible: "Recovery Link Sent"
- tapOn: "BACK TO LOGIN"
- assertVisible: "Enter the system"
