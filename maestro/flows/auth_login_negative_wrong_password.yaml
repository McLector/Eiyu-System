appId: com.anonymous.eiyusystem
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "EIYU SYSTEM"
    timeout: 30000
- tapOn: "you@example.com"
- inputText: "maestro.tester@eiyu.test"
- tapOn: "••••••••"
- inputText: "TotallyWrongPassword999"
- hideKeyboard
- tapOn: "ENTER SYSTEM"
# Must stay on the auth screen with a visible error, never silently succeed.
- assertVisible: "EIYU SYSTEM"
- assertNotVisible: "BOARD"
