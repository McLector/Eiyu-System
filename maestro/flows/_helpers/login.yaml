appId: com.anonymous.eiyusystem
---
# Reusable: log in as the persistent Maestro test account (created once by
# 00_setup_create_test_account.yaml). Included via `runFlow` from every flow
# that needs a logged-in session.
- runFlow: launch_fresh.yaml
- tapOn: "you@example.com"
- inputText: "maestro.tester@eiyu.test"
- tapOn: "••••••••"
- inputText: "TestPass123!"
- hideKeyboard
- tapOn: "ENTER SYSTEM"
- assertVisible: "BOARD"
