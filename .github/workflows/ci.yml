name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: shared
        run: npx tsc --noEmit -p packages/shared && npm test -w @eiyu/shared
      - name: mobile
        run: cd mobile && npx tsc --noEmit && npx jest --ci
      - name: web
        run: cd web && npx tsc --noEmit && npx vitest run
      - name: lint
        run: npm run lint
