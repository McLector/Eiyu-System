name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    # Tests build the Supabase client at import time but never reach a server; these are placeholders, not secrets.
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder-key
      EXPO_PUBLIC_SUPABASE_URL: http://localhost:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: shared
        run: npx tsc --noEmit -p packages/shared && npm test -w @eiyu/shared
      - name: mobile
        run: cd mobile && npx tsc --noEmit && npx jest --ci
      - name: web
        run: cd web && npx tsc --noEmit && npx vitest run
      - name: lint
        run: npm run lint
