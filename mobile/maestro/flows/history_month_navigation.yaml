appId: com.mclector.eiyusystem
---
# Date-independent: computes the month labels from today's date. History is
# reached through the account menu -> Settings -> Quest History (Settings is no
# longer a tab).
- evalScript: |
    ${
      var names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      var d = new Date();
      output.cur = (names[d.getMonth()] + ' ' + d.getFullYear()).toUpperCase();
      var b1 = new Date(d.getFullYear(), d.getMonth() - 1, 1);
      output.back1 = (names[b1.getMonth()] + ' ' + b1.getFullYear()).toUpperCase();
      var b9 = new Date(d.getFullYear(), d.getMonth() - 9, 1);
      output.back9 = (names[b9.getMonth()] + ' ' + b9.getFullYear()).toUpperCase();
    }
- runFlow: _helpers/login.yaml
- tapOn:
    point: "75%, 5%"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 8000
- tapOn: "Settings"
# Quest History is below the fold of the Settings sheet.
- scrollUntilVisible:
    element: "Quest History"
    direction: DOWN
- tapOn: "Quest History"
- assertVisible: "HISTORY"
- assertVisible: "TODAY"
- assertVisible: ${output.cur}

# Back one month, then nine months (crosses a year boundary for any date
# before October), then forward again to today's month. The chevrons are
# icon-only, so they are addressed by testID.
- tapOn:
    id: "history-prev-month"
- assertVisible: ${output.back1}
- repeat:
    times: 8
    commands:
      - tapOn:
          id: "history-prev-month"
- assertVisible: ${output.back9}
# Step forward until today's month shows (capped). A fixed nine taps ended one
# month short twice on the phone, while the shift logic itself is unit-tested:
# a tap during the month fetch is occasionally swallowed there.
- repeat:
    while:
      notVisible: ${output.cur}
    times: 12
    commands:
      - tapOn:
          id: "history-next-month"
- assertVisible: ${output.cur}
