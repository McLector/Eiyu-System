appId: com.mclector.eiyusystem
---
# Lane journey on the redesigned Board: three lanes (Daily, One-time, Backlog) selected by tab or swipe;
# All Habits is a sheet opened from the Daily lane; Archived lives in the account menu.
- tapOn: "BOARD"
- extendedWaitUntil:
    visible: "P2 Notification Retry"
    timeout: 30000
- assertVisible:
    id: "board-lane-tab-daily"
- assertVisible:
    id: "board-lane-tab-one-time"
- assertVisible:
    id: "board-lane-tab-backlog"
- assertVisible: "P2 Notification Retry"
- tapOn: "ALL HABITS"
- assertVisible: "ALL HABITS"
- tapOn: "Close"
- tapOn:
    id: "board-lane-tab-backlog"
- assertVisible: "BACKLOG"
- tapOn:
    id: "board-lane-tab-daily"
- assertVisible: "P2 Notification Retry"
