appId: com.mclector.eiyusystem
---
# Phase 3 local lane journey. It exercises the native phone selector against
# the same authenticated disposable account used by the browser checks.
- tapOn: "BOARD"
- extendedWaitUntil:
    visible: "P2 Notification Retry"
    timeout: 30000
- swipe:
    start: 90%, 35%
    end: 20%, 75%
    duration: 500
- assertVisible:
    id: "board-lane-tab-daily"
- assertVisible: "P2 Notification Retry"
- tapOn:
    id: "board-lane-tab-all-habits"
- assertVisible:
    id: "board-lane-tab-all-habits"
- assertVisible: "ALL HABITS"
- scrollUntilVisible:
    element:
      id: "board-lane-tab-archived"
    direction: RIGHT
    centerElement: true
- tapOn:
    id: "board-lane-tab-archived"
- assertVisible: "ARCHIVED"
- assertVisible:
    id: "board-archived-empty"
- scrollUntilVisible:
    element:
      id: "board-lane-tab-daily"
    direction: LEFT
    centerElement: true
- tapOn:
    id: "board-lane-tab-daily"
- assertVisible: "P2 Notification Retry"
