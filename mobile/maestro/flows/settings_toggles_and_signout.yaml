appId: com.mclector.eiyusystem
---
# Settings is opened from the account menu (top-right); Logout also lives there.
- runFlow: _helpers/login.yaml
- tapOn:
    point: "75%, 5%"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 8000
- tapOn: "Settings"
- assertVisible: "Quest History"

# The theme switch keeps one stable name ("Dark Theme") and flips its checked
# state; the screen re-themes without crashing.
- assertVisible:
    id: settings-dark-theme
    checked: true
- tapOn:
    id: settings-dark-theme
- assertVisible:
    id: settings-dark-theme
    checked: false
- assertVisible: "Dark Theme"
- tapOn:
    id: settings-dark-theme
- assertVisible:
    id: settings-dark-theme
    checked: true

# The palette radiogroup repaints the app and keeps the pick selected.
- tapOn: "Monarch violet"
- assertVisible:
    text: "Monarch violet"
    checked: true
- tapOn: "Cyan"

# Sound Effects: normalize to on, leave Settings, and verify the stored state
# survives reopening the sheet.
- runFlow:
    when:
      visible:
        id: settings-sound-effects
        checked: false
    commands:
      - tapOn:
          id: settings-sound-effects
- assertVisible:
    id: settings-sound-effects
    checked: true
- tapOn: "Close Settings"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "75%, 5%"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 8000
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: settings-sound-effects
    checked: true
- takeScreenshot: settings-sound-after-reopen

# Logout returns to the auth screen.
- tapOn: "Close Settings"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "75%, 5%"
- extendedWaitUntil:
    visible: "Logout"
    timeout: 8000
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "EIYU SYSTEM"
    timeout: 15000
- assertNotVisible: "BOARD"
- takeScreenshot: after-logout
