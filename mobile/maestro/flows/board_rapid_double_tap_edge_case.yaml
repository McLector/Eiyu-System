appId: com.mclector.eiyusystem
---
# Edge case: rapid double-tap on the same checkbox before the network
# round-trip for the first toggle resolves. Should not double-count XP,
# desync from the server, or throw an unhandled error.
- runFlow: _helpers/login.yaml
- runFlow:
    file: _helpers/create_habit.yaml
    env:
      HABIT_NAME: "Rapid Tap Habit"

- tapOn:
    id: "quest-checkbox"
    text: "Rapid Tap Habit.*"
- tapOn:
    id: "quest-checkbox"
    text: "Rapid Tap Habit.*"
- tapOn:
    id: "quest-checkbox"
    text: "Rapid Tap Habit.*"
- extendedWaitUntil:
    visible: "Rapid Tap Habit"
    timeout: 5000
# Manual check afterward: re-launch and confirm the completed state and
# XP total match a single toggle, not three.

# Cleanup: keep the shared test account's board empty between flow runs
# so index-0 checkbox targeting stays valid for other flows. testID
# sidesteps the checkbox/edit-trigger label collision (see maestro/README.md).
- tapOn: "Open Rapid Tap Habit details"
- tapOn: "Edit quest"
- runFlow: _helpers/delete_open_quest.yaml
- assertNotVisible: "Rapid Tap Habit"
