appId: com.mclector.eiyusystem
---
# Run this with E2E_EMAIL, E2E_PASSWORD, and E2E_NAME supplied through the
# Maestro environment to create a disposable account. Re-running after signup
# will fail because Supabase rejects the duplicate address.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "EIYU SYSTEM"
    timeout: 30000
- tapOn: "Register"
- tapOn: "Kaito Mizuru"
- inputText: ${E2E_NAME}
- tapOn: "you@example.com"
- inputText: ${E2E_EMAIL}
- tapOn: "••••••••"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "BEGIN JOURNEY"
- assertVisible: "BOARD"
