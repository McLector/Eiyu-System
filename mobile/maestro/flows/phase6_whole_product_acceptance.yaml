# Phase 6 FINAL-01 Android leg. Run only against the disposable local account
# also used by the web leg; the appId matches Expo's generated Android package.
appId: com.mclector.eiyusystem
---
# Rewritten in mobile-parity slice 5 for the redesigned Board (lane tabs, ALL HABITS sheet,
# row action sheet, Archived habits in the account menu). Not yet run on a device.
- runFlow: _helpers/launch_fresh.yaml
- tapOn: "Email address"
- inputText: ${PHASE6_EMAIL}
- tapOn: "Password"
- inputText: ${PHASE6_PASSWORD}
- hideKeyboard
- tapOn: "ENTER SYSTEM"
- extendedWaitUntil:
    visible: "BOARD"
    timeout: 30000
- takeScreenshot: android-authenticated-board

# Read the same persisted state created through the web UI.
- tapOn:
    id: "board-lane-tab-daily"
- assertVisible: "P6 Quantity Quest"
- assertVisible: "3/3"
- assertVisible: "P6 Penalty Today"
- takeScreenshot: android-cross-platform-state
# The row's check button carries the plain quest name as its label.
- tapOn: "P6 Penalty Today"
- assertVisible: "P6 Penalty Today (completed)"
- tapOn:
    id: "board-lane-tab-one-time"
- assertVisible: "P6 One-Time Quest (completed)"

# A schedule edit is prospective: Saturday remains an off-day, while the
# M/W/F definition is still available in the catalog (ALL HABITS sheet).
- tapOn:
    id: "board-lane-tab-daily"
- tapOn: "ALL HABITS"
- assertVisible: "P6 Scheduled Penalty"
- assertVisible: "Mon, Wed, Fri"
- assertVisible: "OFF DAY"

# Archive and restore the off-day definition without creating a Saturday row.
- tapOn: "More actions for P6 Scheduled Penalty"
- tapOn: "Archive"
- tapOn: "Close"
- tapOn:
    id: "account-trigger"
- tapOn: "Archived habits"
- assertVisible: "P6 Scheduled Penalty"
- tapOn: "Restore P6 Scheduled Penalty"
- tapOn: "Close Archived habits"
- tapOn: "ALL HABITS"
- assertVisible: "OFF DAY"
- tapOn: "Close"

# Delete completed disposable quests only after their evidence has been read.
- tapOn:
    id: "board-lane-tab-one-time"
- tapOn: "More actions for P6 One-Time Quest"
- tapOn: "Delete permanently"
- assertVisible: "DELETE P6 One-Time Quest PERMANENTLY?"
- tapOn:
    id: "board-delete-confirm"
- tapOn:
    id: "board-lane-tab-daily"
- tapOn: "ALL HABITS"
- tapOn: "More actions for P6 Penalty Today"
- tapOn: "Archive"
- tapOn: "Close"
- tapOn:
    id: "account-trigger"
- tapOn: "Archived habits"
- tapOn: "Delete P6 Penalty Today"
- tapOn: "Confirm permanent delete"
- tapOn: "Close Archived habits"
- assertVisible: "BOARD"

# Deleted quest history, settings, and profile persistence.
- tapOn: "Phase 6 Android, Acceptance Runner, rank E"
- tapOn: "Settings"
- tapOn: "Quest History"
- extendedWaitUntil:
    visible: "HISTORY"
    timeout: 15000
- assertVisible: "P6 One-Time Quest"
- assertVisible: "P6 Penalty Today"
- takeScreenshot: android-history-after-delete
- back
- tapOn: "Phase 6 Android, Acceptance Runner, rank E"
- tapOn: "Edit details"
- tapOn: "Display name"
- eraseText
- inputText: "Phase 6 Android"
- hideKeyboard
- tapOn: "Class"
- eraseText
- inputText: "Acceptance Runner"
- hideKeyboard
- tapOn: "Save"
- assertVisible: "Phase 6 Android"
- tapOn: "Phase 6 Android, Acceptance Runner, rank E"
- tapOn: "Settings"
- tapOn:
    id: settings-dark-theme
- tapOn:
    id: settings-dark-theme
- tapOn: "Close Settings"
- tapOn: "STATUS"
- tapOn: "CHAIN"
- tapOn: "BOARD"

# Verify auth/cache isolation with a second local-only disposable account.
- tapOn: "Phase 6 Android, Acceptance Runner, rank E"
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "EIYU SYSTEM"
    timeout: 15000
- tapOn: "Email address"
- inputText: ${PHASE6_OTHER_EMAIL}
- tapOn: "Password"
- inputText: ${PHASE6_OTHER_PASSWORD}
- hideKeyboard
- tapOn: "ENTER SYSTEM"
- extendedWaitUntil:
    visible: "BOARD"
    timeout: 30000
- assertNotVisible: "P6 Quantity Quest"
- assertNotVisible: "Phase 6 Android"
- takeScreenshot: android-account-isolation
- tapOn:
    id: "board-lane-tab-one-time"
- assertNotVisible: "P6 One-Time Quest"
- tapOn: "Phase 6 Isolation, Developer, rank E"
- tapOn: "Logout"
- extendedWaitUntil:
    visible: "EIYU SYSTEM"
    timeout: 15000

# Return to the primary account, verify surviving progress, and restart without
# clearing its local auth/session state.
- tapOn: "Email address"
- inputText: ${PHASE6_EMAIL}
- tapOn: "Password"
- inputText: ${PHASE6_PASSWORD}
- hideKeyboard
- tapOn: "ENTER SYSTEM"
- extendedWaitUntil:
    visible: "BOARD"
    timeout: 30000
- assertVisible: "Phase 6 Android"
- tapOn:
    id: "board-lane-tab-daily"
- assertVisible: "P6 Quantity Quest"
- assertVisible: "3/3"
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: ".*(EIYU SYSTEM|10\\.0\\.2\\.2|BOARD).*"
    timeout: 60000
- tapOn:
    text: ".*10\\.0\\.2\\.2.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - pressKey: BACK
- extendedWaitUntil:
    visible: "BOARD"
    timeout: 60000
- assertVisible: "Phase 6 Android"
- assertVisible: "P6 Quantity Quest"
- assertVisible: "3/3"
- takeScreenshot: android-final-primary-state
- takeScreenshot: android-final-primary-state
- tapOn: "STATUS"
- tapOn: "CHAIN"
- tapOn: "BOARD"
