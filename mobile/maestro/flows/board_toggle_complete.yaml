appId: com.mclector.eiyusystem
---
- runFlow: _helpers/login.yaml
- runFlow:
    file: _helpers/create_habit.yaml
    env:
      HABIT_NAME: "Toggle Complete Habit"

# Full completion via tap -> +20 XP toast (FULL_XP, lib/eiyu-logic.ts) is
# a ~900ms fade animation, too fast for a reliable screenshot-based
# assertion - check the persisted progress-pill state instead.
- tapOn:
    id: "quest-checkbox"
    text: "Toggle Complete Habit.*"
- assertVisible: "1/1"

# Toggling again should un-complete it rather than getting stuck
# completed or double-awarding XP.
- tapOn:
    id: "quest-checkbox"
    text: "Toggle Complete Habit.*"
- assertVisible: "0/1"

# Cleanup: keep the shared test account's board empty between flow runs.
# testID sidesteps the checkbox/edit-trigger label collision (see
# maestro/README.md).
- tapOn: "Open Toggle Complete Habit details"
- tapOn: "Edit quest"
- runFlow: _helpers/delete_open_quest.yaml
- assertNotVisible: "Toggle Complete Habit"
