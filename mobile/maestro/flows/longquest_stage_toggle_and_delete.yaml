appId: com.mclector.eiyusystem
---
# Mobile parity slice 3. Written for the new Chain screens, not yet run on a device.
- runFlow: _helpers/login.yaml
- tapOn: "CHAIN"
- tapOn: "NEW CHAIN"
- tapOn: "e.g. Ship a Side Project"
- inputText: "Long Quest To Delete"
- hideKeyboard
- tapOn: "Stage 1"
- inputText: "First stage"
- hideKeyboard
- tapOn: "Stage 2"
- inputText: "Second stage"
- hideKeyboard
- tapOn:
    id: "long-quest-save"
- assertVisible: "Long Quest To Delete"

# Open the chain, complete the first stage: it becomes Done and the second becomes Current.
- tapOn: "Long Quest To Delete.*"
# Navigation to the detail screen is slow on the phone.
- extendedWaitUntil:
    visible: "Current"
    timeout: 15000
- assertVisible: "Locked"
- tapOn:
    id: "stage-complete"
- assertVisible: "Stage completed."
- assertVisible: "50%"

# Undo it from the stage menu (only the last finished stage offers it).
- tapOn: "Actions for First stage"
- tapOn: "Mark not done"
- assertVisible: "Stage undone."
- assertVisible: "0%"

# Delete: cancel first, then confirm.
- tapOn:
    id: "chain-more"
- tapOn: "Delete"
- assertVisible: ".*Earned XP remains.*"
- tapOn:
    id: "chain-delete-cancel"
- assertVisible: "Long Quest To Delete"
- tapOn:
    id: "chain-more"
- tapOn: "Delete"
- tapOn:
    id: "chain-delete-confirm"
- assertNotVisible: "Long Quest To Delete"
