appId: com.anonymous.eiyusystem
---
- runFlow: _helpers/login.yaml
- tapOn: "QUESTS"
- tapOn: "ADD A LONG QUEST"
- tapOn: "e.g. Ship a Side Project"
- inputText: "Long Quest To Delete"
- hideKeyboard
- tapOn: "Stage 1"
- inputText: "First stage"
- hideKeyboard
- tapOn: "Stage 2"
- inputText: "Second stage"
- hideKeyboard
- tapOn: "CREATE LONG QUEST"
- assertVisible: "Long Quest To Delete"

# Expand the card and toggle the first stage complete. Tap the "0/2"
# progress text, not the quest title - the title row is now its own
# edit-trigger Pressable (Slice 3) and would open the editor instead of
# expanding the card (and "First stage" would still assert visible there,
# since the editor prefills it - a deceptive false pass). The card-header
# tap is also unreliable immediately after CREATE (the sheet's close
# transition is still animating right as the tap fires) - confirmed
# manually the app itself behaves correctly, it's a timing race with the
# automated tap.
- waitForAnimationToEnd
- tapOn: "0/2"
- assertVisible: "First stage"
- tapOn:
    id: "stage-checkbox"
    index: 0
- assertVisible: "NEXT"

# Delete: native Alert.alert - title text collides with the row button's
# own label ("Delete Long Quest" appears twice once the dialog is open),
# so anchor on the alert's body text instead to avoid an ambiguous match.
- tapOn: "Delete Long Quest"
- assertVisible: ".*will be removed permanently.*"
- tapOn: "Cancel"
- assertVisible: "Long Quest To Delete"

# Now actually delete it.
- tapOn: "Delete Long Quest"
- assertVisible: ".*will be removed permanently.*"
- tapOn: "Delete"
- assertNotVisible: "Long Quest To Delete"
