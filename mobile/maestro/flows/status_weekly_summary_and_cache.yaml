appId: com.mclector.eiyusystem
---
- runFlow: _helpers/login.yaml
- tapOn: "STATUS"
- assertVisible: "ATTRIBUTE PROGRESS"
- tapOn: "WEEKLY"
- assertVisible: "WEEKLY DEBRIEF"
- assertVisible: "LAST 7 DAYS"
- extendedWaitUntil:
    notVisible: "Reading the week.*"
    timeout: 20000
# Live success requires an actual generated paragraph. Readable errors are
# covered by the local failure tests, not accepted as a live-success pass.
- assertVisible:
    id: "weekly-summary-content"
    text: ".+"

# Re-visiting the tab this session must read the cache, not regenerate -
# switch away and back and confirm it's instant (no loading flash).
- tapOn: "STATS"
- tapOn: "WEEKLY"
- assertNotVisible: "Reading the week.*"
- assertVisible:
    id: "weekly-summary-content"
    text: ".+"

# Regenerate button (Slice 2.1) - this flow runs against the shared,
# persistent Maestro test account, whose daily regen count carries over
# between runs. So this does NOT assert which outcome follows a tap (a new
# paragraph vs. the "used both regenerations" cap message) - only that
# tapping regenerate always resolves out of its in-flight state, never
# leaves the button stuck on "REGENERATING…".
- assertVisible: ".*REGENERATE.*"
- tapOn: ".*REGENERATE.*"
- extendedWaitUntil:
    notVisible: "REGENERATING…"
    timeout: 15000
