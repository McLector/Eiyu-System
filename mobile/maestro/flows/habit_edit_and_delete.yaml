appId: com.mclector.eiyusystem
---
- runFlow: _helpers/login.yaml
- tapOn: "ADD A QUEST"
# Phase 4: the "+" button now opens a quest-type chooser first.
- tapOn: "HABIT QUEST"
- tapOn: "e.g. Code for 2 hours"
- inputText: "Habit To Edit Then Delete"
- tapOn: "e.g. Code for 20 minutes"
- inputText: "delete me easy version"
- hideKeyboard
- scrollUntilVisible:
    element: "CREATE QUEST"
    direction: DOWN
    timeout: 8000
- tapOn: "CREATE QUEST"
- assertVisible: "Habit To Edit Then Delete"

# The checkbox's accessibilityLabel is the quest's plain name (board.tsx),
# colliding with the same text on the row's separate edit-trigger Pressable
# - tapping by name text is unreliable (empirically lands on the checkbox,
# toggling completion, even with an index). testID sidesteps it.
- tapOn:
    id: "quest-edit-trigger"
- tapOn: "Edit quest"
- assertVisible: "EDIT QUEST"
- tapOn: "e.g. Code for 2 hours"
- eraseText
- inputText: "Habit After Edit"
- hideKeyboard
# SAVE CHANGES and the delete/archive buttons sit below the fold.
- scrollUntilVisible:
    element: "SAVE CH.*"
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: "quest-delete-permanent"
- tapOn: "SAVE CH.*"
- assertVisible: "Habit After Edit"
- assertNotVisible: "Habit To Edit Then Delete"

- tapOn:
    id: "quest-edit-trigger"
- tapOn: "Edit quest"
- runFlow: _helpers/delete_open_quest.yaml
- assertNotVisible: "Habit After Edit"
