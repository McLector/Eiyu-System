appId: com.mclector.eiyusystem
---
# Create a quantity habit from the Board. Env: HABIT_NAME, HABIT_TARGET.
# A target count of at least 2 replaces the required Penalty.
- tapOn: "ADD A QUEST"
- tapOn: "HABIT QUEST"
- assertVisible: "NEW QUEST"
- tapOn: "Quest name"
- inputText: ${HABIT_NAME}
- hideKeyboard
- scrollUntilVisible:
    element: "Target count"
    direction: DOWN
    timeout: 8000
- tapOn: "Target count"
- inputText: ${HABIT_TARGET}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "quest-save"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "quest-save"
- extendedWaitUntil:
    notVisible: "NEW QUEST"
    timeout: 15000
- assertVisible: ${HABIT_NAME}
