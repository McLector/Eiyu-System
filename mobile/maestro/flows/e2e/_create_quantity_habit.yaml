appId: com.mclector.eiyusystem
---
# Create a quantity habit from the Board. Env: HABIT_NAME, HABIT_TARGET.
# A target count replaces the required Penalty.
- tapOn: "ADD A QUEST"
- tapOn: "HABIT QUEST"
- tapOn: "e.g. Code for 2 hours"
- inputText: ${HABIT_NAME}
- hideKeyboard
- scrollUntilVisible:
    element: "Leave blank for a normal habit"
    direction: DOWN
    timeout: 8000
    centerElement: true
- tapOn: "Leave blank for a normal habit"
- inputText: ${HABIT_TARGET}
- hideKeyboard
- scrollUntilVisible:
    element: "CREATE QUEST"
    direction: DOWN
    timeout: 8000
- tapOn: "CREATE QUEST"
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible: ${HABIT_NAME}
