# A3: quantity habit. Env: E2E_EMAIL, E2E_PASSWORD.
appId: com.mclector.eiyusystem
---
- runFlow: ../_helpers/login.yaml
- runFlow:
    file: _create_quantity_habit.yaml
    env:
      HABIT_NAME: "E2E Quantity"
      HABIT_TARGET: "3"
# A quantity habit shows a progress counter (done/target), not a checkbox.
- assertVisible: "0/3"

# Cleanup: delete it by its own label so the account stays empty.
- tapOn: "Open E2E Quantity details"
- tapOn: "Edit quest"
- runFlow: ../_helpers/delete_open_quest.yaml
- assertNotVisible: "Open E2E Quantity details"
