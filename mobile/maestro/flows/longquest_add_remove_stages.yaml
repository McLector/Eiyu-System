appId: com.mclector.eiyusystem
---
# Stage list edge cases in the editor: a chain needs at least one stage (the last Remove button disappears) and has
# no upper limit. Written for the new editor, not yet run on a device.
- runFlow: _helpers/login.yaml
- tapOn: "CHAIN"
- tapOn: "NEW CHAIN"
- tapOn: "e.g. Ship a Side Project"
- inputText: "Stage List Edge Cases"
- hideKeyboard

# Two blank stages to start: remove the second, and the last Remove button goes away.
- scrollUntilVisible:
    element: "ADD STAGE"
    direction: DOWN
    timeout: 8000
- tapOn: "Remove stage 2"
- assertNotVisible: "Remove stage 1"
- assertNotVisible: "Stage 2"

# Adding brings the Remove buttons back, and there is no maximum.
- tapOn: "ADD STAGE"
- assertVisible: "Remove stage 1"
- takeScreenshot: e2e-longquest-stage-list
