appId: com.mclector.eiyusystem
---
# Mobile parity slice 3: the Chain tab lists chains; a chain opens on its own screen. Written for the new screens, not yet run on a device.
- runFlow: _helpers/login.yaml
- tapOn: "CHAIN"
- tapOn: "NEW CHAIN"
- assertVisible: "NEW LONG QUEST"
- tapOn: "e.g. Ship a Side Project"
- inputText: "Maestro Long Quest Happy Path"
- hideKeyboard
- tapOn: "Stage 1"
- inputText: "First stage"
- hideKeyboard
- tapOn: "Stage 2"
- inputText: "Second stage"
- hideKeyboard
- tapOn:
    id: "long-quest-save"
- assertVisible: "Maestro Long Quest Happy Path"
- assertVisible: "0/2"

# Cleanup: keep the shared test account's board empty between flow runs.
- tapOn: "Maestro Long Quest Happy Path.*"
- tapOn:
    id: "chain-more"
- tapOn: "Delete"
- assertVisible: ".*Earned XP remains.*"
- tapOn:
    id: "chain-delete-confirm"
- assertNotVisible: "Maestro Long Quest Happy Path"
