appId: com.mclector.eiyusystem
---
# Phase 4 (#7): the board's "+" opens a quest-type chooser; a ONE-TIME quest
# is today-only, has no Penalty or day-picker, and validates on name alone.
- runFlow: _helpers/login.yaml
- tapOn: "ADD A QUEST"
- assertVisible: "NEW QUEST"
- tapOn: "1-TIME QUEST"
- assertVisible: "NEW 1-TIME QUEST"
- assertNotVisible: "PENALTY"
- assertNotVisible: "DAYS"
- tapOn: "e.g. Code for 2 hours"
- inputText: "Maestro One-Time Quest"
- hideKeyboard
- scrollUntilVisible:
    element: "CREATE QUEST"
    direction: DOWN
    timeout: 8000
- tapOn: "CREATE QUEST"
# The board stays on the Daily lane after creating (finding F-018); the
# one-time quest lives in its own lane.
- tapOn:
    id: "board-lane-tab-one-time"
- assertVisible: "Maestro One-Time Quest"

# Cleanup: same persistent-account reasoning as habit_create_happy — edit
# it away so later flows start from a clean board. testID sidesteps the
# checkbox/edit-trigger label collision (see habit_create_happy.yaml).
- tapOn:
    id: "quest-edit-trigger"
- tapOn: "Edit quest"
- assertVisible: "EDIT QUEST"
- runFlow: _helpers/delete_open_quest.yaml
- assertNotVisible: "Maestro One-Time Quest"
