appId: com.mclector.eiyusystem
---
# Reusable: log in as a disposable account. Pass E2E_EMAIL / E2E_PASSWORD via
# the Maestro environment (-e). Included via `runFlow` by every flow that needs
# a logged-in session.
- runFlow: launch_fresh.yaml
- tapOn: "Email address"
- inputText: ${E2E_EMAIL}
# On the phone the IME occasionally drops a character (a "." went missing once);
# retype once if the field does not show the exact address.
- runFlow:
    when:
      notVisible: ${E2E_EMAIL}
    commands:
      - eraseText: 80
      - inputText: ${E2E_EMAIL}
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "ENTER SYSTEM"
- extendedWaitUntil:
    visible: "BOARD"
    timeout: 30000
