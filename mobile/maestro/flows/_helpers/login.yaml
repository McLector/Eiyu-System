appId: com.mclector.eiyusystem
---
# Reusable: log in as a disposable account. Pass E2E_EMAIL / E2E_PASSWORD via
# the Maestro environment (-e). Included via `runFlow` by every flow that needs
# a logged-in session.
- runFlow: launch_fresh.yaml
- tapOn: "Email address"
- inputText: ${E2E_EMAIL}
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "ENTER SYSTEM"
- extendedWaitUntil:
    visible: "BOARD"
    timeout: 30000
