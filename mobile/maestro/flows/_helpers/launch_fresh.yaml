appId: com.mclector.eiyusystem
---
# `launchApp` always force-restarts the process (clearState or not), and a
# fresh dev-client process lands on Expo dev-launcher's server picker screen
# - that connection is process-level, not persisted data, so clearState
# doesn't change this. Handle both outcomes: tap the remembered server if the
# picker shows, no-op otherwise, then wait for the real app.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*(EIYU SYSTEM|10\\.0\\.2\\.2).*"
    timeout: 60000
- tapOn:
    text: ".*10\\.0\\.2\\.2.*"
    optional: true
# Let the SDK 54 first-connection tutorial finish presenting before checking
# for it; the underlying EIYU screen can become visible first.
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: ".*(EIYU SYSTEM|developer menu|problem loading the project|Error loading app).*"
    timeout: 120000
# Occasional one-off bundle-download timeout from the emulator (env flake):
# the error screen offers Reload, which returns to the server picker.
- runFlow:
    when:
      visible: ".*problem loading the project.*"
    commands:
      - tapOn: "Reload"
      - extendedWaitUntil:
          visible: ".*10\\.0\\.2\\.2.*"
          timeout: 30000
      - tapOn:
          text: ".*10\\.0\\.2\\.2.*"
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible: ".*(EIYU SYSTEM|developer menu).*"
          timeout: 120000
- runFlow:
    when:
      visible: ".*Error loading app.*"
    commands:
      - tapOn: "Close"
      - extendedWaitUntil:
          visible: ".*10\\.0\\.2\\.2.*"
          timeout: 15000
      - tapOn:
          text: ".*10\\.0\\.2\\.2.*"
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible: ".*(EIYU SYSTEM|developer menu|Error loading app).*"
          timeout: 120000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 5000
# "Continue" advances into the dev-menu panel instead of closing it (see
# README "Known selector traps"); hardware Back closes it in place.
- runFlow:
    when:
      visible: "Connected to:"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible: "EIYU SYSTEM"
    timeout: 30000
