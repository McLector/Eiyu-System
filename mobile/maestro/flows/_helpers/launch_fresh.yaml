appId: com.anonymous.eiyusystem
---
# `launchApp` always force-restarts the process (clearState or not), and a
# fresh dev-client process lands on Expo dev-launcher's server picker screen
# - that connection is process-level, not persisted data, so clearState
# doesn't change this. Handle both outcomes: tap the remembered server if the
# picker shows, no-op otherwise, then wait for the real app.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*(EIYU SYSTEM|10\\.0\\.2\\.2).*"
    timeout: 60000
- tapOn:
    text: ".*10\\.0\\.2\\.2.*"
    optional: true
# First connection after clearState can trigger Expo Go's dev-menu tutorial.
# Its close icon has no accessibility label in SDK 54, so use the stable
# top-right location of that bottom-sheet icon only while the tutorial copy is
# visible. Hardware back is not reliable here: on the Android 35 emulator
# it left the tutorial covering the login screen.
- extendedWaitUntil:
    visible: ".*(EIYU SYSTEM|developer menu).*"
    timeout: 30000
- runFlow:
    when:
      visible: ".*This is the developer menu.*"
    commands:
      - tapOn:
          point: "93%,53%"
- extendedWaitUntil:
    visible: "EIYU SYSTEM"
    timeout: 30000
