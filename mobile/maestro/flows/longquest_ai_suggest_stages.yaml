appId: com.mclector.eiyusystem
---
- runFlow: _helpers/login.yaml
- tapOn: "QUESTS"
- tapOn: "ADD A LONG QUEST"
- tapOn: "e.g. Ship a Side Project"
- inputText: "Get a full-stack developer job"
- hideKeyboard
- tapOn: ".*SUGGEST STAGES.*"
- extendedWaitUntil:
    visible: "THINKING.*"
    timeout: 10000
- extendedWaitUntil:
    notVisible: "THINKING.*"
    timeout: 20000
# Live success requires a populated third generated stage; a readable provider
# error is covered separately by the outage/component test path.
- assertVisible:
    id: "long-quest-stage-name-3"
    text: "^Stage 3: (?!empty$).+"
# Stage suggestions remain editable after they are generated.
- tapOn: "Stage 1"
- inputText: "MANUALEDITMARKER"
- assertVisible: ".*MANUALEDITMARKER.*"
