appId: com.mclector.eiyusystem
---
# Written for the new editor, not yet run on a device. A chain needs a name and at least one named stage.
- runFlow: _helpers/login.yaml
- tapOn: "CHAIN"
- tapOn: "NEW CHAIN"
- assertVisible: "NEW LONG QUEST"

# Nothing filled in: Save is disabled, so tapping it changes nothing.
- tapOn:
    id: "long-quest-save"
- assertVisible: "NEW LONG QUEST"

# Name only, no stage named: still blocked.
- tapOn: "e.g. Ship a Side Project"
- inputText: "Name Only No Stages"
- hideKeyboard
- tapOn:
    id: "long-quest-save"
- assertVisible: "NEW LONG QUEST"

# Leaving with an unsaved name asks first; Keep Editing stays.
- tapOn: "Close long quest editor"
- assertVisible: "Discard changes?"
- tapOn: "Keep Editing"
- assertVisible: "NEW LONG QUEST"
- assertVisible: "Name Only No Stages"
