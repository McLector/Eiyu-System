appId: com.anonymous.eiyusystem
---
- runFlow: _helpers/login.yaml
- tapOn: "QUESTS"
- tapOn: "ADD A LONG QUEST"
- assertVisible: "CREATE LONG QUEST"

# No name, no stages filled - blocked.
- tapOn: "CREATE LONG QUEST"
- assertVisible: "NEW LONG QUEST"

# Name only, zero stages filled (MIN_STAGES = 2) - still blocked.
- tapOn: "e.g. Ship a Side Project"
- inputText: "Name Only No Stages"
- hideKeyboard
- tapOn: "CREATE LONG QUEST"
- assertVisible: "NEW LONG QUEST"

# Name + exactly one stage filled - still below MIN_STAGES, still blocked.
- tapOn: "Stage 1"
- inputText: "Only one stage"
- hideKeyboard
- tapOn: "CREATE LONG QUEST"
- assertVisible: "NEW LONG QUEST"
