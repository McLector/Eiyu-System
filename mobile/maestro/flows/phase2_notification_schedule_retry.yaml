appId: com.mclector.eiyusystem
---
# Local-only notification scheduling boundary. The quest was created on web
# before this flow; the authenticated mobile store sync should schedule it.
- tapOn:
    point: "50%,90%"
- tapOn:
    text: "Reload"
    optional: true
- extendedWaitUntil:
    visible: "EIYU SYSTEM"
    timeout: 60000
- tapOn: "you@example.com"
- eraseText
- inputText: ${PHASE2_EMAIL}
- tapOn: "••••••••"
- eraseText
- inputText: ${PHASE2_PASSWORD}
- hideKeyboard
- tapOn: "ENTER SYSTEM"
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "BOARD"
    timeout: 30000
- assertVisible: "P2 Notification Retry"
