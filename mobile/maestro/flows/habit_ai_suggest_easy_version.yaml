appId: com.mclector.eiyusystem
---
- runFlow: _helpers/login.yaml
- tapOn: "ADD A QUEST"
# Phase 4: the "+" button now opens a quest-type chooser first.
- tapOn: "HABIT QUEST"
- tapOn: "e.g. Code for 2 hours"
- inputText: "Learn Spanish"
- hideKeyboard
- tapOn: ".*SUGGEST PENALTIES.*"
- assertVisible: "THINKING.*"
- extendedWaitUntil:
    notVisible: "THINKING.*"
    timeout: 20000
# This is the live-success path: all three generated choices must appear.
# Each chip remains editable by tapping it, and AI output is never auto-saved.
- assertVisible:
    id: "quest-ai-suggestion-1"
    text: ".+"
- assertVisible:
    id: "quest-ai-suggestion-2"
    text: ".+"
- assertVisible:
    id: "quest-ai-suggestion-3"
    text: ".+"
- tapOn: "e.g. Code for 20 minutes"
- inputText: "Manually typed override"
- assertVisible: "Manually typed override"
