appId: com.mclector.eiyusystem
---
# STALE (mobile redesign, slice 1b): this flow walks the old Board lanes (All Habits / Archived tabs, per-row Archive and Delete buttons, long-press Penalty).
# Those moved: All Habits is a sheet behind the ALL HABITS button, archived quests are in the account menu, row actions are in the more-button sheet.
# Rewrite the lane and lifecycle steps against the new Board before relying on it.
# Local-only Phase 2 retry. The browser restores and archives this account's
# quest against the disposable Supabase stack before this flow starts.
- tapOn:
    point: "50%,90%"
- tapOn:
    text: "Reload"
    optional: true
- extendedWaitUntil:
    visible: "EIYU SYSTEM"
    timeout: 60000
- tapOn: "you@example.com"
- eraseText
- inputText: ${PHASE2_EMAIL}
- tapOn: "••••••••"
- eraseText
- inputText: ${PHASE2_PASSWORD}
- hideKeyboard
- tapOn: "ENTER SYSTEM"
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "BOARD"
    timeout: 30000
- assertVisible: "P2 Local Lifecycle"
- assertVisible: "ARCHIVED"
- tapOn: "Edit P2 Local Lifecycle"
- extendedWaitUntil:
    visible: "EDIT QUEST"
    timeout: 15000
- swipe:
    direction: UP
- tapOn:
    id: "quest-delete-permanent"
- assertVisible: "DELETE QUEST PERMANENTLY?"
- tapOn:
    id: "quest-delete-cancel"
- assertVisible: "EDIT QUEST"
