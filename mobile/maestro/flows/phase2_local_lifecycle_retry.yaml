appId: com.mclector.eiyusystem
---
# Rewritten in mobile-parity slice 5 for the redesigned Board; not yet run on a device.
# Local-only Phase 2 retry. The browser restores and archives this account's
# quest against the disposable Supabase stack before this flow starts.
- tapOn:
    point: "50%,90%"
- tapOn:
    text: "Reload"
    optional: true
- extendedWaitUntil:
    visible: "EIYU SYSTEM"
    timeout: 60000
- tapOn: "you@example.com"
- eraseText
- inputText: ${PHASE2_EMAIL}
- tapOn: "••••••••"
- eraseText
- inputText: ${PHASE2_PASSWORD}
- hideKeyboard
- tapOn: "ENTER SYSTEM"
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "BOARD"
    timeout: 30000
# An archived quest is off the Board and lives in Archived habits (account menu).
- assertNotVisible: "P2 Local Lifecycle"
- tapOn:
    id: "account-trigger"
- tapOn: "Archived habits"
- assertVisible: "P2 Local Lifecycle"
- tapOn: "Delete P2 Local Lifecycle"
- assertVisible: "Delete permanently?"
- tapOn: "Cancel"
- assertNotVisible: "Delete permanently?"
- assertVisible: "P2 Local Lifecycle"
